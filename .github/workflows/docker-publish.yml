name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Publishing policy: semver releases carry 1.2.0 / 1.2 / latest.
          # Main-branch builds only ever mint a dev sha-<commit> tag —
          # never a branch-name tag, and never `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          attestations: false
          provenance: false
          sbom: false

      - name: Remove legacy orphan tags (one-time registry cleanup)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ github.event.repository.name }}
          ORPHANS: "main sha-1de34aa sha-2060095 sha-6a9b465 sha-7305c9a sha-a1685c7 sha-b905326 sha-c686b0b sha-c690854 sha-fc65eb7"
          PROTECTED: "1.2.0 1.2 latest"
        run: |
          # Orphans left by the pre-1.1 publishing setup (branch-name 'main'
          # tag + old dev 'sha-*' tags). The current main's sha- tag is NOT
          # in ORPHANS and is kept on purpose.
          #
          # GHCR's registry API has no DELETE (HTTP 405), so the script uses
          # the GitHub packages REST API. It never deletes a version shared
          # by PROTECTED tags (1.2.0 / 1.2 / latest), because GitHub
          # deletes the digest and every tag pointing at it.
          #
          # Idempotent - after the first successful run, remove this step
          # and the ORPHANS list. See scripts/registry-cleanup.py.
          python3 scripts/registry-cleanup.py
